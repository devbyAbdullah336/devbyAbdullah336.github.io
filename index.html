<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SoulsArena</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="hero">
    <div class="overlay"></div>

    <h1 class="title">SoulsArena</h1>
    <p class="subtitle">From Idea to Reality</p>

    <div class="doc-embed-container">
        <button id="toggleDocBtn" class="button" onclick="toggleDocument()">View Document</button>
        
        <div id="documentFrameWrapper" style="display: none; width: 100%; height: 600px;">
            <iframe src="https://view.officeapps.live.com/op/embed.aspx?src=https://yourusername.github.io/your-repository-name/document.docx" 
                    frameborder="0">
            </iframe>
        </div>
    </div>

    <div class="corner-ui">
        <div class="top-left">
            <a href="credits.html" class="button">Credits</a>
            <a href="Research.html" class="button">Research</a>
        </div>

        <div class="top-right">
            <a href="game.html" class="button">Game Journey</a>
            <a href="website.html" class="button">Web Journey</a>
        </div>
    </div>

</div>

<script>
function toggleDocument() {
    var wrapper = document.getElementById("documentFrameWrapper");
    var btn = document.getElementById("toggleDocBtn");
    
    if (wrapper.style.display === "none") {
        wrapper.style.display = "block";
        btn.innerText = "Hide Document";
        // Smoothly scrolls down to bring the document into view once it opens
        wrapper.scrollIntoView({ behavior: 'smooth' });
    } else {
        wrapper.style.display = "none";
        btn.innerText = "View Document";
    }
}
</script>

</body>
</html>
